# list of languages for which language servers are started; choose from:
#   al               bash             clojure          cpp              csharp           csharp_omnisharp
#   dart             elixir           elm              erlang           fortran          go
#   haskell          java             julia            kotlin           lua              markdown
#   nix              perl             php              python           python_jedi      r
#   rego             ruby             ruby_solargraph  rust             scala            swift
#   terraform        typescript       typescript_vts   yaml             zig
languages:
- markdown

# the encoding used by text files in the project
# For a list of possible encodings, see https://docs.python.org/3.11/library/codecs.html#standard-encodings
encoding: "utf-8"

# whether to use the project's gitignore file to ignore files
ignore_all_files_in_gitignore: true

# list of additional paths to ignore
ignored_paths:
- ".claude/**"

# whether the project is in read-only mode
# If set to true, all editing tools will be disabled and attempts to use them will result in an error
# Added on 2025-04-18
read_only: false

# list of tool names to exclude
excluded_tools: []

# initial prompt for the project
initial_prompt: |
  # Serena Project Activation

  ## Project Activation
  **IMPORTANT:** You MUST activate this project at the start of every session using:

  ```
  activate_project(project_name="technical")
  ```

  This activation is REQUIRED before using any Serena tools. It enables:
  - Semantic code search capabilities
  - Symbol navigation and LSP features
  - Project context and indexed code access

  Without activation, Serena tools will not function correctly.

  ## Modes in Serena
  Serena supports multiple operational modes that optimize behavior for specific workflows. You can switch modes dynamically during the session using the `switch_modes` tool.

  ### Available Modes:
  - **planning** - Focuses on planning and analysis tasks (reading, understanding, designing)
  - **editing** - Optimizes for direct code modification tasks (writing, refactoring)
  - **interactive** - Conversational back-and-forth interaction style
  - **one-shot** - Complete tasks in a single response
  - **no-onboarding** - Skip initial onboarding if not needed
  - **onboarding** - Focus on project structure analysis (usually triggered automatically)

  ### Mode Switching:
  Use the `switch_modes` tool to change modes during the session. Examples:
  - "Switch to planning mode" - For analysis and design
  - "Switch to editing mode" - For code modifications
  - "Switch to planning and one-shot modes" - For generating reports/plans

  ### Important Notes:
  - Multiple modes can be active simultaneously
  - Different modes affect available tools and behavior
  - Some combinations are incompatible (e.g., interactive + one-shot)
  - Choose modes intentionally based on current task

  ### Common Workflows:
  - **Code exploration:** planning mode
  - **Implementation:** editing mode
  - **Report generation:** planning + one-shot modes
  - **Interactive debugging:** interactive + editing modes
# the name by which the project can be referenced within Serena
project_name: "technical"

# list of tools to include that would otherwise be disabled
included_optional_tools: []

# list of mode names that are always to be included in the set of active modes
base_modes:

# list of mode names that are to be activated by default
default_modes:

# fixed set of tools to use as the base tool set
fixed_tools: []

# override of the corresponding setting in serena_config.yml, see the documentation there.
# If null or missing, the value from the global config is used.
symbol_info_budget:
